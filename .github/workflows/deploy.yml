name: Deploy (Cloudflare)

# Auto-deploys the OpenNext Cloudflare Worker (metra-web) AFTER the CI workflow
# passes on `main`, so a red build never ships. Deploying by hand
# (`wrangler deploy` from a laptop) is no longer the source of truth.
#
# ONE-TIME ACTIVATION (owner) — see docs/DEPLOY.md:
#   1. Add the repository VARIABLES + the CLOUDFLARE_API_TOKEN secret.
#   2. Set variable DEPLOY_ENABLED = true to arm this workflow.
# Until DEPLOY_ENABLED is "true" the deploy job is skipped (no failed runs).

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

# The job reads the repository and nothing else. Without this block the token
# gets the repository default, which may be read/write.
permissions:
  contents: read

jobs:
  deploy:
    # Only after CI succeeded on a PUSH to THIS repository's main, and only once
    # the owner has armed it.
    #
    # `branches: [main]` above is not that guarantee. It matches the branch NAME
    # of the run that triggered this workflow, and for a pull request from a fork
    # that name is the fork's own branch, which its author chooses. A fork branch
    # called `main` carries its own copy of ci.yml, so it can make "CI" succeed
    # and then have this job build and deploy its commit with the Cloudflare
    # token. The three workflow_run conditions below refuse that: the run must be
    # a push, to main, of this repository.
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.event == 'push'
          && github.event.workflow_run.head_branch == 'main'
          && github.event.workflow_run.head_repository.full_name == github.repository
          && vars.DEPLOY_ENABLED == 'true' }}
    # Pinned, not ubuntu-latest: GitHub moves ubuntu-latest to Ubuntu 26 from
    # Oct 19 2026 (actions/runner-images#14748), and the first CI run after that
    # date failed only its OpenNext build while the same commit builds locally.
    # Move to a newer image deliberately, in its own commit, CI and Deploy together.
    runs-on: ubuntu-24.04
    steps:
      - name: Refuse a commit that is not the tip of main
        # Before any repository code is checked out. A CI run can be re-run long
        # after it first passed, and two runs can finish out of order; either
        # would deploy an OLDER commit over a newer one with nothing to notice.
        # Only the commit main points at right now may ship. To put an older
        # build back, use `npx wrangler rollback <version-id>` (docs/DEPLOY.md,
        # "Rolling back"), not a re-run.
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          main_tip="$(gh api "repos/${REPOSITORY}/commits/main" --jq .sha)"
          if [ -z "${main_tip}" ]; then
            echo "::error::could not read the tip of main; refusing to deploy."
            exit 1
          fi
          if [ "${main_tip}" != "${VALIDATED_SHA}" ]; then
            echo "::error::CI validated ${VALIDATED_SHA}, but main is at ${main_tip}. Only the tip of main is deployed."
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Deploy the exact commit CI validated.
          ref: ${{ github.event.workflow_run.head_sha }}
          # The token is not left in .git/config: everything after this step
          # (npm install scripts, the build) is third-party code, and it shares
          # this runner with the Cloudflare token.
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # Node 22: required by the pinned wrangler (4.156.0, engines.node >=22.0.0).
          node-version: 22
          cache: npm

      - name: Install (monorepo workspaces)
        # Deterministic install from the committed lockfile (Linux binaries are
        # recorded in it), so the deploy builds the exact tree CI validated.
        run: npm ci

      - name: Build the Worker (OpenNext for Cloudflare)
        working-directory: apps/web
        env:
          # Public client values (baked into the browser bundle at build time).
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_DEFAULT_LOCALE: ${{ vars.NEXT_PUBLIC_DEFAULT_LOCALE }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
          # Search Console / Bing ownership tags (optional; blank = no tag).
          NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ vars.NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION }}
          NEXT_PUBLIC_BING_SITE_VERIFICATION: ${{ vars.NEXT_PUBLIC_BING_SITE_VERIFICATION }}
          # The sign-in Turnstile site key (optional; blank = no widget; docs/DEPLOY.md).
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
        # Generate the gitignored CloudflareEnv typings before building. The
        # --env-interface/output flags MUST match local generation: plain
        # `wrangler types` emits a Cloudflare.Env/global Env shape, not the
        # `interface CloudflareEnv` the code + OpenNext expect (would fail tsc on
        # Property 'HYPERDRIVE' does not exist on type 'CloudflareEnv').
        # No --dangerouslyUseUnsupportedNextVersion: the pinned OpenNext
        # (1.20.15, @opennextjs/aws 4.1.14) supports a Next major until the
        # second next major is released, so Next 15 passes its support check.
        run: npx wrangler types --env-interface=CloudflareEnv ./cloudflare-env.d.ts && npx opennextjs-cloudflare build

      - name: Emit the pre-rendered pages as static assets
        working-directory: apps/web
        # The landing and login pages are served as static assets, before the
        # Worker runs (Workers Free plan 10 ms CPU cap, Error 1102). OpenNext
        # does not copy pre-rendered HTML into .open-next/assets; this does, and
        # fails if a page stopped being static. Before the secret scan, so the
        # scan covers the HTML. See docs/DEPLOY.md.
        # The same verification tags go into the "/" redirector page here.
        env:
          NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ vars.NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION }}
          NEXT_PUBLIC_BING_SITE_VERIFICATION: ${{ vars.NEXT_PUBLIC_BING_SITE_VERIFICATION }}
        run: node scripts/emit-static-pages.mjs

      - name: Assert no secret was baked into the Worker bundle
        working-directory: apps/web
        # OpenNext COMPILES the project's .env* FILES into
        # .open-next/cloudflare/next-env.mjs at build time, and that module ships
        # inside the deployed artifact. So the rule is: no .env* file in a CI or
        # deploy build. This job has only NEXT_PUBLIC_* in its env and checks out
        # no .env (it is gitignored), which is exactly what this step proves —
        # loudly, because the mistake compiles and lints perfectly and is visible
        # nowhere else. At RUNTIME the Worker's own vars and secrets are copied
        # into process.env per request by OpenNext's populateProcessEnv, so a
        # secret read through runtimeSecret() never needs to be in the bundle.
        run: node scripts/assert-no-baked-secrets.mjs

      - name: Deploy the Worker (Wrangler)
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
