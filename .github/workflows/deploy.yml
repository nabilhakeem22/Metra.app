name: Deploy (Cloudflare)

# Auto-deploys the OpenNext Cloudflare Worker (metra-web) AFTER the CI workflow
# passes on `main`, so a red build never ships. Deploying by hand
# (`wrangler deploy` from a laptop) is no longer the source of truth.
#
# ONE-TIME ACTIVATION (owner) — see docs/DEPLOY.md:
#   1. Add the repository VARIABLES + the CLOUDFLARE_API_TOKEN secret.
#   2. Set variable DEPLOY_ENABLED = true to arm this workflow.
# Until DEPLOY_ENABLED is "true" the deploy job is skipped (no failed runs).

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    # Only after CI succeeded on main, and only once the owner has armed it.
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success'
          && vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Deploy the exact commit CI validated.
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v4
        with:
          # Node 22: required by the pinned wrangler (4.123.0).
          node-version: 22
          cache: npm

      - name: Install (monorepo workspaces)
        # Deterministic install from the committed lockfile (Linux binaries are
        # recorded in it), so the deploy builds the exact tree CI validated.
        run: npm ci

      - name: Build the Worker (OpenNext for Cloudflare)
        working-directory: apps/web
        env:
          # Public client values (baked into the browser bundle at build time).
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_DEFAULT_LOCALE: ${{ vars.NEXT_PUBLIC_DEFAULT_LOCALE }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
        # Generate the gitignored CloudflareEnv typings before building. The
        # --env-interface/output flags MUST match local generation: plain
        # `wrangler types` emits a Cloudflare.Env/global Env shape, not the
        # `interface CloudflareEnv` the code + OpenNext expect (would fail tsc on
        # Property 'HYPERDRIVE' does not exist on type 'CloudflareEnv').
        run: npx wrangler types --env-interface=CloudflareEnv ./cloudflare-env.d.ts && npx opennextjs-cloudflare build

      - name: Assert no secret was baked into the Worker bundle
        working-directory: apps/web
        # OpenNext COMPILES the project's .env* FILES into
        # .open-next/cloudflare/next-env.mjs at build time, and that module ships
        # inside the deployed artifact. So the rule is: no .env* file in a CI or
        # deploy build. This job has only NEXT_PUBLIC_* in its env and checks out
        # no .env (it is gitignored), which is exactly what this step proves —
        # loudly, because the mistake compiles and lints perfectly and is visible
        # nowhere else. At RUNTIME the Worker's own vars and secrets are copied
        # into process.env per request by OpenNext's populateProcessEnv, so a
        # secret read through runtimeSecret() never needs to be in the bundle.
        run: node scripts/assert-no-baked-secrets.mjs

      - name: Deploy the Worker (Wrangler)
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
