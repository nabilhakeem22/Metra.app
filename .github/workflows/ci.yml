name: CI

on:
  push:
    branches: [main, engagement-step-9]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Local Postgres service. createSql() disables SSL for localhost.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      # No Chromium needed for lint / isolation; the PDF spike isn't exercised in CI.
      PUPPETEER_SKIP_DOWNLOAD: 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 22: required by the pinned wrangler (4.123.0); everything else
          # is compatible.
          node-version: 22
          cache: npm

      - name: Install
        # Deterministic install from the committed lockfile. The lock is generated
        # with all Linux platform binaries recorded (`npm install --os=linux
        # --cpu=x64`), so `npm ci` finds the Linux rollup/esbuild/swc binaries and
        # never re-resolves — no drift, no npm/cli#4828. See docs/DEPLOY.md.
        run: npm ci

      - name: Lint (includes physical left/right ban)
        run: npm run lint

      - name: Unit tests (db)
        run: npm run test -w @metra/db

      - name: Unit tests (web)
        run: npm run test -w @metra/web

      - name: Apply migrations
        run: npm run migrate -w @metra/db

      - name: Apply RLS, roles (metra_app) and functions
        run: npm run apply-rls -w @metra/db

      - name: Seed two orgs
        run: npm run seed -w @metra/db

      - name: Cross-tenant isolation (P0 exit gate)
        run: npm run test:isolation -w @metra/db

      - name: Action-core DB tests (seeded DB, fabricated OrgContext)
        run: npm run test:actions -w @metra/web

      # Additive Cloudflare gate: proves the OpenNext (Workers) bundle still
      # builds. No deploy, no Cloudflare auth — build output only. Runs last so
      # it never affects the existing lint -> unit -> migrate -> apply-rls ->
      # seed -> isolation -> actions pipeline above.
      - name: Cloudflare OpenNext build (no deploy)
        working-directory: apps/web
        # next build inlines NEXT_PUBLIC_* at build time; without them the
        # Supabase browser client init throws during static generation. Values
        # come from repo Actions variables (public client config).
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_DEFAULT_LOCALE: ${{ vars.NEXT_PUBLIC_DEFAULT_LOCALE }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
        # Generate the gitignored binding typings before the type-check. The
        # `--env-interface=CloudflareEnv ./cloudflare-env.d.ts` flags MUST match
        # how the file is generated locally: plain `wrangler types` emits a
        # `Cloudflare.Env`/global `Env` shape instead of the `interface
        # CloudflareEnv` the code (cfEnv(): CloudflareEnv) and OpenNext expect,
        # so the build's type-check fails on `Property 'HYPERDRIVE' does not
        # exist on type 'CloudflareEnv'`.
        run: npx wrangler types --env-interface=CloudflareEnv ./cloudflare-env.d.ts && npx opennextjs-cloudflare build
