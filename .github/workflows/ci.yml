name: CI

# `validate/**` is a DELIBERATE part of this trigger, not a leftover.
#
# It used to be added by hand before pushing a validation branch and stripped
# again on merge. That ritual had two silent failure modes, and the dangerous one
# was forgetting to ADD it: the branch pushed, CI never ran, and the change went
# to main unvalidated with nothing to notice. Forgetting to STRIP it — which is
# how this became permanent — was harmless by comparison.
#
# A control enforced by memory, whose failure is silent, is not a control. The
# prefix is reserved for pre-merge validation, so running CI on it is always the
# intent. Do not "clean this up".
on:
  push:
    branches: [main, 'validate/**']
  pull_request:
    branches: [main]

# One run per ref. Pushing again to a validation branch cancels the run that the
# new commit just made obsolete, so a work-in-progress branch cannot stack up
# pipelines nobody reads — which is the real cost of the permanent trigger, and
# is fixed here rather than by asking a human to remember something.
# `main` is deliberately included: a superseded main run gates a deploy that a
# newer commit is about to supersede anyway.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Local Postgres service. createSql() disables SSL for localhost.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      # No Chromium needed for lint / isolation; the PDF spike isn't exercised in CI.
      PUPPETEER_SKIP_DOWNLOAD: 'true'

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the "Migration batch size" step below counts the
          # migrations this ref ADDS relative to `main`, and a depth-1 checkout
          # has no merge base to count against.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          # Node 22: required by the pinned wrangler (4.123.0); everything else
          # is compatible.
          node-version: 22
          cache: npm

      - name: Install
        # Deterministic install from the committed lockfile. The lock is generated
        # with all Linux platform binaries recorded (`npm install --os=linux
        # --cpu=x64`), so `npm ci` finds the Linux rollup/esbuild/swc binaries and
        # never re-resolves — no drift, no npm/cli#4828. See docs/DEPLOY.md.
        run: npm ci

      # Pure-local i18n gate (no API key, never calls Gemini): enforces en/ar-EG
      # key parity, placeholder/ICU integrity, and Western-numerals-only on every
      # push. Non-strict, so pre-existing plural-completeness gaps stay warnings
      # until the re-translate lands.
      - name: i18n validate (parity + placeholders + numerals)
        run: npm run i18n:validate

      # Documentation ratchet (no network, no database): the root DEPLOY.md
      # stays deleted (owner decision 9), no tracked .md outside docs/BUILD-LOG.md
      # mentions the host we left, and no em/en dash sits inside Arabic prose.
      # Each of the three was a real regression that nothing noticed.
      - name: Docs gate (decision 9, stale-host mentions, Arabic dashes)
        run: npm run docs:check

      - name: Lint (includes physical left/right ban)
        run: npm run lint

      - name: Unit tests (db)
        run: npm run test -w @metra/db

      - name: Unit tests (web)
        run: npm run test -w @metra/web

      # O9 - `db:migrate` runs every PENDING migration as ONE transaction, so the
      # ACCESS EXCLUSIVE window is the sum of the batch, not of one file. 0049 +
      # 0050 measured ~630 ms against a 5 s lock_timeout (~8x headroom); ten DDL
      # migrations in one batch would not be. This counts what the ref adds
      # relative to `main` and fails above the constant. If you legitimately need
      # more, split the merge, or raise MAX_PENDING_MIGRATIONS in the SAME commit
      # that explains why. The count goes to the run summary either way, so the
      # number is visible on a green run too.
      - name: Migration batch size
        env:
          MAX_PENDING_MIGRATIONS: '4'
        run: |
          set -euo pipefail
          git fetch --no-tags --quiet origin main
          base="$(git merge-base origin/main HEAD)"
          count="$(git diff --name-only --diff-filter=A "$base" HEAD -- packages/db/migrations | grep -c '\.sql$' || true)"
          line="pending migrations: $count / $MAX_PENDING_MIGRATIONS"
          echo "$line"
          echo "$line" >> "$GITHUB_STEP_SUMMARY"
          if [ "$count" -gt "$MAX_PENDING_MIGRATIONS" ]; then
            echo "::error::$line - one db:migrate transaction would hold ACCESS EXCLUSIVE for the whole batch. Split the merge, or raise MAX_PENDING_MIGRATIONS in the same commit that explains why."
            exit 1
          fi

      - name: Apply migrations
        run: npm run migrate -w @metra/db

      - name: Apply RLS, roles (metra_app) and functions
        run: npm run apply-rls -w @metra/db

      - name: Seed two orgs
        run: npm run seed -w @metra/db

      - name: Cross-tenant isolation (P0 exit gate)
        run: npm run test:isolation -w @metra/db

      - name: Action-core DB tests (seeded DB, fabricated OrgContext)
        run: npm run test:actions -w @metra/web

      # Additive Cloudflare gate: proves the OpenNext (Workers) bundle still
      # builds. No deploy, no Cloudflare auth — build output only. Runs last so
      # it never affects the existing lint -> unit -> migrate -> apply-rls ->
      # seed -> isolation -> actions pipeline above.
      - name: Cloudflare OpenNext build (no deploy)
        working-directory: apps/web
        # next build inlines NEXT_PUBLIC_* at build time; without them the
        # Supabase browser client init throws during static generation. Values
        # come from repo Actions variables (public client config).
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_DEFAULT_LOCALE: ${{ vars.NEXT_PUBLIC_DEFAULT_LOCALE }}
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL }}
        # Generate the gitignored binding typings before the type-check. The
        # `--env-interface=CloudflareEnv ./cloudflare-env.d.ts` flags MUST match
        # how the file is generated locally: plain `wrangler types` emits a
        # `Cloudflare.Env`/global `Env` shape instead of the `interface
        # CloudflareEnv` the code (cfEnv(): CloudflareEnv) and OpenNext expect,
        # so the build's type-check fails on `Property 'HYPERDRIVE' does not
        # exist on type 'CloudflareEnv'`.
        run: npx wrangler types --env-interface=CloudflareEnv ./cloudflare-env.d.ts && npx opennextjs-cloudflare build

      - name: Assert no secret was baked into the Worker bundle
        working-directory: apps/web
        # OpenNext COMPILES the project's .env* FILES into
        # .open-next/cloudflare/next-env.mjs at build time, and that module ships
        # inside the deployed artifact. So the rule is: no .env* file in a CI or
        # deploy build. This job has only NEXT_PUBLIC_* in its env and checks out
        # no .env (it is gitignored), which is exactly what this step proves —
        # loudly, because the mistake compiles and lints perfectly and is visible
        # nowhere else. At RUNTIME the Worker's own vars and secrets are copied
        # into process.env per request by OpenNext's populateProcessEnv, so a
        # secret read through runtimeSecret() never needs to be in the bundle.
        run: node scripts/assert-no-baked-secrets.mjs
